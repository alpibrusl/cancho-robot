name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # The compiler these sources are built and tested with: part of the contract, since a source file does not record
  # which `std` it was written against. Kept equal to cancho.toml's `cancho`; it moves in a change that says why.
  CANCHO_REV: 7bf3628c1089ed6e46d26062435267f8991d114f

jobs:
  test:
    # No hardware here, ever: everything CI runs is pure code against recorded or generated bytes
    # (docs/design.md section 11). Tests that touch a servo bus are a local-only target.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: robot

      - uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ env.CANCHO_REV }}
          path: cancho

      - name: The pinned compiler is the one cancho.toml names
        working-directory: robot
        run: grep -q "cancho = \"${CANCHO_REV}\"" cancho.toml

      - name: Cache the compiler
        id: compiler
        uses: actions/cache@v4
        with:
          path: cancho/target/release/cancho
          key: cancho-${{ env.CANCHO_REV }}

      - name: Build cancho
        if: steps.compiler.outputs.cache-hit != 'true'
        working-directory: cancho
        run: cargo build --release -p cancho

      - name: Formatting
        working-directory: robot
        run: ../cancho/target/release/cancho fmt --check src tests

      - name: Codec tests (the spike's packets and replies, each refusal, every string of up to six bytes)
        working-directory: robot
        run: |
          ../cancho/target/release/cancho test tests/feetech_test.cho src/feetech.cho --std
          ../cancho/target/release/cancho test tests/feetech_write_test.cho src/feetech.cho src/feetech_write.cho --std

      - name: Build the codec driver
        working-directory: robot
        run: mkdir -p build && ../cancho/target/release/cancho build --std tests/driver.cho src/feetech.cho src/feetech_write.cho -o build/driver

      - name: scservo_sdk, the oracle of the differential test (Unlicense)
        run: pip install feetech-servo-sdk==1.0.0

      - name: Differential test against scservo_sdk (gate C1)
        working-directory: robot
        run: python3 tests/differential_codec.py build/driver --cases 20000

      - name: The codec's gates can fail (each deliberately wrong codec is caught)
        working-directory: robot
        run: python3 tests/mutate_codec.py ../cancho/target/release/cancho python3

      - name: Authority is within the ceiling (gate A4)
        working-directory: robot
        run: python3 tests/authority_check.py ../cancho/target/release/cancho authority/driver.ceiling tests/driver.cho src/feetech.cho src/feetech_write.cho

      - name: The authority gate can fail (a ceiling that is too small, and one that is stale, must be refused)
        working-directory: robot
        run: |
          printf 'io_write\n' > /tmp/too-small.ceiling
          python3 tests/authority_check.py ../cancho/target/release/cancho /tmp/too-small.ceiling tests/driver.cho src/feetech.cho src/feetech_write.cho --expect-failure
          printf 'io_read\nio_write\nforeign open\n' > /tmp/stale.ceiling
          python3 tests/authority_check.py ../cancho/target/release/cancho /tmp/stale.ceiling tests/driver.cho src/feetech.cho src/feetech_write.cho --expect-failure

      - name: Calibration tests (this robot's ranges, truncation, drive mode, inverted ranges, sign-magnitude)
        working-directory: robot
        run: ../cancho/target/release/cancho test tests/calibration_test.cho src/calibration.cho --std

      - name: Build the calibration driver
        working-directory: robot
        run: ../cancho/target/release/cancho build --std tests/calibration_driver.cho src/calibration.cho -o build/calibration_driver

      - name: LeRobot's motor bus, the oracle of the calibration differential
        # lerobot.motors imports lerobot.utils, which imports torch (device_utils); the CPU wheel is enough and nothing
        # here runs a model. --no-deps keeps the rest of LeRobot's stack (datasets, video) out.
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-deps lerobot==0.6.1
          pip install tqdm huggingface_hub draccus numpy pyserial deepdiff

      - name: Calibration differential against LeRobot, bit for bit (gate C3)
        working-directory: robot
        run: python3 tests/differential_calibration.py build/calibration_driver --cases 200

      - name: The calibration gates can fail (each deliberately wrong calibration is caught)
        working-directory: robot
        run: python3 tests/mutate_calibration.py ../cancho/target/release/cancho python3

      - name: Calibration driver authority is within its ceiling
        working-directory: robot
        run: python3 tests/authority_check.py ../cancho/target/release/cancho authority/calibration_driver.ceiling tests/calibration_driver.cho src/calibration.cho

      - name: The kinematic chain is what the URDF says (src/so101.cho is generated, not edited)
        working-directory: robot
        run: python3 scripts/gen_chain.py tests/fixtures/urdf/so101_new_calib.urdf --check src/so101.cho

      - name: Kinematics tests (placo's zero pose, a rigid transform, the base axis, the conversion)
        working-directory: robot
        run: ../cancho/target/release/cancho test tests/kinematics_test.cho src/kinematics.cho src/so101.cho --std

      - name: Build the kinematics driver
        working-directory: robot
        run: ../cancho/target/release/cancho build --std tests/kinematics_driver.cho src/kinematics.cho src/so101.cho -o build/kinematics_driver

      - name: placo, the solver LeRobot's RobotKinematics wraps (MIT)
        run: pip install placo==0.9.23

      - name: Forward kinematics against placo (gate C4)
        working-directory: robot
        run: python3 tests/differential_kinematics.py build/kinematics_driver --cases 5000

      - name: The kinematics gates can fail (each deliberately wrong kinematics is caught)
        working-directory: robot
        run: python3 tests/mutate_kinematics.py ../cancho/target/release/cancho python3

      - name: Kinematics driver authority is within its ceiling
        working-directory: robot
        run: python3 tests/authority_check.py ../cancho/target/release/cancho authority/kinematics_driver.ceiling tests/kinematics_driver.cho src/kinematics.cho src/so101.cho
